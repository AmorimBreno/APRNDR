<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TextArea — prévia</title>
<style>
  body { padding: 24px; }
  .wrap { max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aprndr, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(A.TextArea, {
        label: 'Anotação da aula',
        maxLength: 500,
        defaultValue: 'Professor mostrou que a derivada de uma constante é zero porque a reta tangente é horizontal.',
        hint: 'Vai para o caderno de Cálculo I, na aula de hoje.'
      })
    )
  );
</script>
</body>
</html>
