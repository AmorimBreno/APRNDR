<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SelectionMenu — prévia</title>
<style>
  body { padding: 24px; }
  .wrap { position: relative; max-width: 640px; padding-top: 56px; }
  .menu { position: absolute; top: 0; left: 150px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aprndr, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(A.SelectionMenu, {
        className: 'menu',
        actions: [
          { label: 'Reexplicar', icon: 'refresh' },
          { label: 'Exemplo', icon: 'bulb' },
          { label: 'Anotar', icon: 'notebook' }
        ]
      }),
      h(A.Prose, null,
        h('p', null, 'Pela regra da cadeia, ', h('mark', null, 'a derivada de uma composição é a derivada de fora vezes a de dentro'), '. Em sen(x²), a de fora é cos(x²) e a de dentro é 2x.')
      )
    )
  );
</script>
</body>
</html>
