<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Wordmark — prévia</title>
<style>
  body { padding: 24px; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: var(--radius-lg); background: var(--surface-panel); }
  .bar .overline { color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aprndr, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'col' },
      h(A.Wordmark, { size: 64 }),
      h('div', { className: 'bar' },
        h(A.Wordmark, { size: 18 }),
        h('span', { className: 'overline' }, 'Cálculo I · Módulo 03')
      )
    )
  );
</script>
</body>
</html>
