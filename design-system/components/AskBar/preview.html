<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AskBar — prévia</title>
<style>
  body { padding: 28px; }
  .col { display: flex; flex-direction: column; gap: 32px; max-width: 720px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aprndr, h = React.createElement;
  var chips = [
    { label: 'Continuar', icon: 'arrow-right' },
    { label: 'Outro exemplo', icon: 'bulb' },
    { label: 'Não entendi', icon: 'help' },
    { label: 'Me testa', icon: 'checklist' }
  ];
  function Demo() {
    var busy = React.useState(true);
    return h('div', { className: 'col' },
      h(A.AskBar, { suggestions: chips, onSuggestion: function () {}, onEnd: function () {}, onAttach: function () {}, onSend: function () {} }),
      h(A.AskBar, { generating: busy[0], onStop: function () { busy[1](false); }, hint: false })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
