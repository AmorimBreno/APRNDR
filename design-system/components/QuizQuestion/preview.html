<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QuizQuestion — prévia</title>
<style>
  body { padding: 24px; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aprndr, h = React.createElement;
  function Demo() {
    var v = React.useState('d');
    var shown = React.useState(true);
    return h(A.QuizQuestion, {
      number: 3, total: 10, kicker: 'Módulo 03 · Derivadas',
      prompt: 'Qual é a derivada de f(x) = x² no ponto x = 3?',
      options: [
        { id: 'a', label: '3' },
        { id: 'b', label: '6' },
        { id: 'c', label: '9' },
        { id: 'd', label: '2x, para qualquer x' }
      ],
      value: v[0],
      onChange: v[1],
      correctId: shown[0] ? 'b' : undefined
    },
      h('div', { className: 'foot' },
        shown[0]
          ? h(A.Button, { variant: 'ghost', icon: 'refresh', onClick: function () { v[1](null); shown[1](false); } }, 'Refazer')
          : h(A.Button, { variant: 'primary', disabled: !v[0], onClick: function () { shown[1](true); } }, 'Conferir')
      )
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
